<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Matemáticas LDK</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mate LDK">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="confetti-layer" id="confetti"></div>

<div class="app">

    <header class="topbar">
        <button id="btnBack" class="btn-back hidden" data-i18n="menu"></button>
        <h1 class="brand" id="brand"></h1>
        <div class="lang-toggle" id="langToggle">
            <button data-lang="es">ES</button>
            <button data-lang="en">EN</button>
        </div>
    </header>

    <main>

        <section id="screen-home" class="screen">

            <p class="tagline" data-i18n="tagline"></p>

            <div class="settings-bar">
                <span class="settings-label" data-i18n="howMany"></span>
                <div class="count-options" id="countOptions"></div>
            </div>

            <div class="toggle-bar">
                <button class="toggle" id="btnSounds" data-i18n="sounds"></button>
                <button class="toggle" id="btnMusic" data-i18n="music"></button>
            </div>

            <div id="levelGrid"></div>

            <button class="card card-weak hidden" id="btnWeak">
                <span class="card-icon">💪</span>
                <span class="card-title" data-i18n="weakTitle"></span>
                <span class="card-sub" id="weakSub"></span>
            </button>

            <h2 class="path-title" data-i18n="pathTitle"></h2>
            <div class="path" id="levelPath"></div>

            <div class="or-divider"><span data-i18n="orHomework"></span></div>

            <div class="homework-card">
                <h2 data-i18n="homeworkTitle"></h2>
                <p class="homework-hint" data-i18n="homeworkHint"></p>
                <textarea id="homeworkText" rows="5" spellcheck="false" autocomplete="off"></textarea>
                <div id="homeworkWarnings" class="homework-warnings"></div>
                <button id="btnHomework" class="btn-primary btn-wide" data-i18n="homeworkGo"></button>
            </div>

            <div class="home-links">
                <button id="btnAlbum" class="btn-secondary"></button>
                <button id="btnViewScores" class="link-btn" data-i18n="viewScores"></button>
            </div>

            <p class="app-version" id="appVersion"></p>

        </section>

        <section id="screen-quiz" class="screen hidden">

            <div class="quiz-progress">
                <div class="quiz-progress-text">
                    <span id="quizProgressText"></span>
                    <span class="streak hidden" id="streak"></span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar"><div class="progress-fill" id="quizProgressFill"></div></div>
                    <span class="progress-runner" id="progressRunner">🦄</span>
                </div>
            </div>

            <div class="quiz-card">
                <div class="quiz-head">
                    <p class="quiz-instruction" id="quizInstruction"></p>
                    <button class="speaker-btn" id="btnSpeak" data-i18n="listen"></button>
                </div>
                <div class="quiz-prompt" id="quizPrompt"></div>
                <div class="quiz-options" id="quizOptions"></div>
                <p class="quiz-feedback" id="quizFeedback"></p>
            </div>

            <div class="keypad hidden" id="keypad">
                <button data-key="1">1</button>
                <button data-key="2">2</button>
                <button data-key="3">3</button>
                <button data-key="4">4</button>
                <button data-key="5">5</button>
                <button data-key="6">6</button>
                <button data-key="7">7</button>
                <button data-key="8">8</button>
                <button data-key="9">9</button>
                <button data-key="back" class="key-back" id="keyBack">⌫</button>
                <button data-key="0">0</button>
                <button data-key="ok" class="key-ok" id="keyOk">✓</button>
            </div>

        </section>

        <section id="screen-end" class="screen hidden">

            <div class="end-card">
                <div class="end-stars" id="endStars"></div>
                <h2 id="endTitle"></h2>
                <p id="endScore"></p>
                <p id="endBest" class="end-best"></p>
                <div id="endSticker" class="end-sticker hidden"></div>

                <button id="btnPracticeMissed" class="btn-practice hidden"></button>

                <div class="end-buttons">
                    <button id="btnRetry" class="btn-primary" data-i18n="playAgain"></button>
                    <button id="btnMenu" class="btn-secondary" data-i18n="home"></button>
                </div>
            </div>

        </section>

    </main>

</div>

<div class="modal-backdrop hidden" id="scoresBackdrop">
    <div class="modal-card">
        <div class="modal-header">
            <h2 data-i18n="scoresTitle"></h2>
            <button class="modal-close" id="btnCloseScores">✕</button>
        </div>
        <p class="modal-hint" data-i18n="scoresHint"></p>
        <div class="scores-list" id="scoresList"></div>
        <button id="btnResetScores" class="link-btn" data-i18n="resetScores"></button>
    </div>
</div>

<div class="modal-backdrop hidden" id="albumBackdrop">
    <div class="modal-card">
        <div class="modal-header">
            <h2 data-i18n="albumTitle"></h2>
            <button class="modal-close" id="btnCloseAlbum">✕</button>
        </div>
        <p class="modal-hint" id="albumHint"></p>
        <div class="album-grid" id="albumGrid"></div>
    </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/content.js"></script>
<script src="js/engine.js"></script>
<script src="js/hints.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/storage.js"></script>
<script src="js/confetti.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
