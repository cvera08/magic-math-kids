<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math LDK</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="confetti" id="confetti"></div>

<div class="container">

    <div class="top-bar">
        <select
            id="languageSelect"
            class="language-select"
            aria-label="Language"
            onchange="setLanguage(this.value)"
        >
            <option value="en">English</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div class="title">
        <div class="crown">👑</div>
        <h1 data-i18n="title">💖 Math LDK ✨</h1>
    </div>

    <div class="subtitle" data-i18n="subtitle">
        Learning through play 🌟
    </div>

    <div class="card">

        <h2 data-i18n="operationsTitle">🪄 Write the operations</h2>

<textarea id="operations">
2+2
5-2
2*4
3/3
</textarea>

        <button onclick="generateExercises()" data-i18n="generateButton">
            🪄 Generate exercises
        </button>

        <div id="warningArea"></div>

    </div>

    <div id="exerciseSection" class="hidden">

        <div class="card">

            <div class="progress-wrapper">

                <div class="progress-text" id="progressText">
                    🌈 Progress: 0/0
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

            </div>

            <div id="exerciseContainer"></div>

            <div class="celebration">
                <h2>🎉🎉🎉</h2>
                <h2 data-i18n="magicTitle">🪄 MAGIC! 🪄</h2>

                <p data-i18n="completedMessage">
                    You completed all the exercises!
                </p>

                <p>
                    🌟 🌟 🌟 🌟 🌟
                </p>
            </div>

        </div>

    </div>

</div>

<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
